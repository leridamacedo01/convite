<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite 17 Anos - Lérida</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- SEÇÃO 1: CAPA -->
    <section id="capa" class="page active">
        <div class="moldura-dourada"></div>
        <div class="conteudo">
            <h2 class="subtitulo-capa">Comemoração 17 anos</h2>
            <h1 class="nome-principal">Lérida</h1>
            <p class="mensagem-intimista">
                Preparei um momento muito especial para celebrar com quem realmente faz parte da minha vida e tem um lugar guardado no meu coração. Você é uma dessas pessoas.
            </p>
            <button class="btn-dourado" onclick="proximaPagina()">Ver Detalhes</button>
        </div>
    </section>

    <!-- SEÇÃO 2: DETALHES -->
    <section id="detalhes" class="page">
        <div class="moldura-dourada"></div>
        <div class="conteudo">
            <h1 class="titulo-chapter">Chapter Seventeen</h1>
            
            <div class="info-container">
                <div class="info-item">
                    <span class="label">Local</span>
                    <span class="valor">Espaço Dubai Clube</span>
                </div>
                <div class="info-item">
                    <span class="label">Data</span>
                    <span class="valor">09 / 01 / 2027</span>
                </div>
                <div class="info-item">
                    <span class="label">Horário</span>
                    <span class="valor">19:00 h</span>
                </div>
            </div>

            <!-- SUBSTITUA O '#' PELO LINK REAL DA SUA LISTA DE PRESENTES -->
            <a href="https://leridamacedo01.github.io/lista/" target="_blank" class="btn-dourado link-presente">Ideias de Presentes</a>
            
            <button class="btn-voltar" onclick="voltarPagina()">← Voltar</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
